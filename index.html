<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>soundi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20260531-5" />
</head>
<body>
  <main class="app">
    <header class="site-header" aria-label="site header">
      <button class="wordmark nav-button is-active" type="button" data-view="home" aria-label="soundi home">
        soundi
      </button>
      <nav class="nav" aria-label="primary navigation">
        <button class="nav-button" type="button" data-view="compose">Compose</button>
        <button class="nav-button" type="button" data-view="archive">Archive</button>
      </nav>
    </header>

    <section id="homeView" class="view home-view is-active" aria-label="home">
      <div class="hero reveal">
        <h1>See Music.<br />Compose Visually.</h1>
      </div>

      <section class="tutorial" id="tutorial" aria-label="tutorial preview">
        <article class="pitch-step reveal">
          <div class="pitch-demo pitch-demo-high" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <p>Higher position means higher pitch.</p>
        </article>

        <article class="pitch-step reveal">
          <div class="pitch-demo pitch-demo-low" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <p>Lower position means lower pitch.</p>
        </article>

        <article class="note-row reveal">
          <div class="note-scale" aria-hidden="true">
            <span style="--note:#ff3b30">C</span>
            <span style="--note:#ff7a00">D</span>
            <span style="--note:#ffdc21">E</span>
            <span style="--note:#00c900">F</span>
            <span style="--note:#65d2ee">G</span>
            <span style="--note:#3f6df6">A</span>
            <span style="--note:#854cf5">B</span>
          </div>
          <p>Each row represents a different note.</p>
        </article>

        <article class="grid-explain reveal">
          <div class="large-grid" aria-hidden="true">
            <span class="grid-block block-green"></span>
            <span class="grid-block block-orange"></span>
            <span class="grid-block block-purple"></span>
          </div>
          <p class="grid-copy">
            The grid shows time and pitch.<br />
            Place blocks to compose.<br />
          </p>
        </article>

        <article class="ready-section reveal">
          <p>Your composition becomes a visual rhythm.</p>
          <button class="ready-button" type="button" data-view="compose">Ready to compose?</button>
        </article>
      </section>
    </section>

    <section id="composeView" class="view compose-view" aria-label="compose">
      <section class="timebar" aria-label="time indicator">
        <div class="time-track">
          <span id="playhead" class="playhead"></span>
        </div>
      </section>

      <section class="workspace">
        <section class="composition-panel" aria-label="composition grid">
          <div class="score-scroll">
            <div id="scoreGrid" class="score-grid"></div>
          </div>
        </section>

        <aside class="analysis-panel" aria-label="visual analysis">
          <div id="resizeHandle" class="resize-handle" role="separator" aria-orientation="vertical" aria-label="resize visual feedback"></div>
          <section id="visualStage" class="visual-stage">
            <div id="visualTone" class="visual-tone"></div>
            <div id="visualMarks" class="visual-marks"></div>
            <p id="visualCaption" class="visual-caption"></p>
          </section>
          <section id="feedbackCard" class="feedback-card"></section>
        </aside>
      </section>

      <footer class="controlbar">
        <button id="playButton" class="play-button" type="button" aria-pressed="false" aria-label="play composition">Play</button>
        <button id="saveButton" class="save-button" type="button">Save</button>
        <button id="clearButton" class="clear-button" type="button">Clear</button>
      </footer>
    </section>

    <section id="archiveView" class="view archive-view" aria-label="archive">
      <div id="archiveGrid" class="archive-grid"></div>
    </section>
  </main>
  <div id="customCursor" class="custom-cursor" aria-hidden="true">
    <span class="cursor-dot"></span>
    <span class="cursor-hint">please<br />scroll</span>
  </div>

  <script src="script.js?v=20260531-5"></script>
</body>
</html>
